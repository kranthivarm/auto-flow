spring.application.name=auth-service
server.port=8085

# Database Configuration
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT (must match api-gateway)
jwt.secret=${JWT_SECRET:}
# 24 hours in milliseconds
jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info

# Google Calendar OAuth2
google.calendar.client.id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client.secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect.uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8085/api/auth/google/calendar/callback}
google.calendar.token.endpoint=https://oauth2.googleapis.com/token

# AES-256 encryption key for Google OAuth tokens stored in DB
google.calendar.token.encryption.key=${GOOGLE_TOKEN_ENCRYPTION_KEY:}


