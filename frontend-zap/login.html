<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ZapClone</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .auth-brand {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff4a00;
      margin-bottom: 0.25rem;
    }
    .auth-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
    }
    .btn-google {
      width: 100%;
      padding: 9px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s;
    }
    .btn-google:hover { background: #f0f0f0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      color: #bbb;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e8e8;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 13px;
      color: #888;
    }
    .auth-footer a { color: #ff4a00; text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">ZapClone</div>
      <div class="auth-title">Welcome back</div>

      <div id="error-msg" class="error-banner hidden"></div>

      <button class="btn-google" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.6 0 6.6 5.4 2.5 13.4l7.8 6C12.2 13 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.5-4.1 7.1-10.2 7.1-17.1z"/>
          <path fill="#FBBC05" d="M10.3 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.8-6z"/>
          <path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.6-5.9c-2.1 1.4-4.8 2.2-7.9 2.2-6.3 0-11.7-4.2-13.7-10l-7.8 6C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        Login with Google
      </button>

      <div class="divider">or</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@gmail.com"
          onkeydown="if(event.key==='Enter')login()">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')login()">
      </div>

      <button class="btn btn-primary" id="login-btn" onclick="login()"
        style="width:100%;padding:10px">
        Login
      </button>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>

    </div>
  </div>
  <script>
// Check if redirected back from Google OAuth
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const error = params.get('error');

if (token) {
    // Store token and user info
    localStorage.setItem('token', token);
    localStorage.setItem('userId', params.get('userId'));
    localStorage.setItem('userName', params.get('name'));
    localStorage.setItem('userEmail', params.get('email'));

    // Clean URL and redirect to dashboard
    window.history.replaceState({}, '', '/login.html');
    window.location.href = 'index.html';
}

if (error) {
    document.getElementById('error-msg').textContent =
        'Google login failed: ' + error;
    document.getElementById('error-msg')
        .classList.remove('hidden');
}
</script>
  <script src="js/api.js"></script>
  <script>
    // Handle OAuth callback — backend redirects here with ?token=...
    (function () {
      const p = new URLSearchParams(window.location.search);
      const t = p.get('token');
      if (t) {
        localStorage.setItem('token', t);
        localStorage.setItem('user', JSON.stringify({
          name:  p.get('name')  || '',
          email: p.get('email') || '',
        }));
        window.location.href = 'index.html';
      }
    })();

    function loginWithGoogle() {
      window.location.href = `${GATEWAY_URL}/api/auth/google`;
    }

    async function login() {
      const errorEl = document.getElementById('error-msg');
      const btn     = document.getElementById('login-btn');
      errorEl.classList.add('hidden');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorEl.textContent = 'Please enter your email and password.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await authApi.login(email, password);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user || { email }));
        window.location.href = 'index.html';
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.classList.remove('hidden');
        btn.disabled    = false;
        btn.textContent = 'Login';
      }
    }
  </script>
</body>
</html>
